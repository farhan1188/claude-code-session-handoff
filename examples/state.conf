# Copy to .claude/state.conf at your repository root.
#
# HANDOFF     the one document that is current. This pointer, not the filename
#             or its date, decides. Repoint it when you write a new handoff.
# CHECK       the command that tells you whether the project is healthy.
# CHECK_SAFE  the repository's half of the permission to RUN that command at
#             session start. It is not sufficient on its own: your machine must
#             also list this repo's path in ~/.claude/session-state-allow.
#             Until it does, the hook only names the command.

HANDOFF=docs/HANDOFF-2026-01-31-payment-retries.md
CHECK=npm test
CHECK_SAFE=yes
